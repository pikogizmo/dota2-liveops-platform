name: Hourly Data Pipeline

on:
  schedule:
    # Run at minute 15 of every hour (e.g., 14:15, 15:15...)
    # We avoid minute 0 because everyone else schedules then, causing lag.
    - cron: '15 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Hero ETL (Just to be safe/update daily)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_heroes.py

      - name: Run Match ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_matches.py
      
      - name: Run Match Details ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_match_details.py