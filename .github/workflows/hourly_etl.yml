name: Hourly Data Pipeline

on:
  schedule:
    # Run at minute 15 of every hour
    - cron: '15 * * * *'
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Hero ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_heroes.py

      - name: Run Match ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_matches.py
      
      - name: Run Match Details ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etl_match_details.py

      - name: Generate Meta Chart
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run viz_meta.py

      - name: Commit and Push Chart
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meta_snapshot.png
          git commit -m "chore(viz): update meta snapshot [skip ci]" || exit 0
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: update index.html [skip ci]'
          enable_jekyll: false
          exclude_assets: '.github, .venv, .vscode, .git, .gitignore, .python-version, uv.lock, pyproject.toml, *.py, *.md, sql, dbt_analytics'