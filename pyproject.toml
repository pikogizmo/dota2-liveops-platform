[project]
name = "dota2-liveops"
version = "0.1.0"
description = "Automated data pipeline for Dota 2 pro meta analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "dbt-core>=1.10.15",
    "dbt-postgres>=1.9.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.44",
    "plotly>=5.18.0",
    "xgboost>=2.0.0",
]
